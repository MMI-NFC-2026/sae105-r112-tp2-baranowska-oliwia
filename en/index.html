<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cats and Dogs Home</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="alternate" hreflang="fr" href="https://darling-valkyrie-884a09.netlify.app/fr/">
  <link rel="alternate" hreflang="en" href="https://darling-valkyrie-884a09.netlify.app/en/">
  <link rel="alternate" hreflang="x-default" href="https://darling-valkyrie-884a09.netlify.app/">
</head>

<body>
  <header class="header header--home">

    <!--Ce bouton permet d'ouvrir et de fermer le menu grâce à l'attribut popovertarget, sans utiliser JavaScript. -->
    <button class="burger" type="button" popovertarget="menu" aria-label="Menu">
      🍔
    </button>

<!--Le menu est déclaré comme un popover pour être masqué par défaut et s'afficher uniquement lorsqu'on l'ouvre. L'identifiant permet de le cibler depuis les boutons.-->
    <nav class="menu" id="menu" popover aria-label="Main menu">
      <!-- Ce bouton permet de fermer le menu. L'attribut popovertargetaction="hide" indique que le menu doit être masqué lorsqu'on clique dessus. -->
      <button class="menu__close burger burger--close" type="button" popovertarget="menu" popovertargetaction="hide" aria-label="Close the menu" autofocus>
        🍔
      </button>
      <ul class="menu__list">
        <li class="menu__item"><a class="menu__link" href="index.html">Home</a></li>
        <li class="menu__item"><a class="menu__link" href="chats/index.html">Cats</a></li>
        <li class="menu__item"><a class="menu__link" href="chiens/index.html">Dogs</a></li>
        <li class="menu__item"><a class="menu__link" href="../fr/index.html" onclick="document.cookie = 'nf_lang=fr; path=/; SameSite=Strict'">Version française</a></li>


      </ul>
    </nav>
    <!-- End of the main menu -->
  </header>

  <!-- Main page content -->
  <main>
    <h1>Welcome to our site!</h1>
    <p>
      Discover our world dedicated to cats and dogs.
    </p>
  </main>
  <!-- End of the main content -->

</body>

</html>
